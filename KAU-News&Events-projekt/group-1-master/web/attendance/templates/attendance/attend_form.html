{% if user.is_authenticated %}
          
<h2>Sign up to {{ event.EventTitle }}</h2>
<form method="post">
  {% csrf_token %}
  <label for="allergies">Allergies:</label>
  <input type="text" id="allergies" name="allergies"><br><br>

  <label for="dietary_preferences">Dietary Preferences:</label>
  <input type="text" id="dietary_preferences" name="dietary_preferences"><br><br>

  <label for="notes">Other:</label>
  <textarea id="notes" name="notes" rows="3"></textarea><br><br>

  <button type="submit">Sign Up</button>
</form>
{% endif %}
