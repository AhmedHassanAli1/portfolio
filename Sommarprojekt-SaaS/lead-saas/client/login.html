<script src="https://cdn.tailwindcss.com"></script>

<div class="h-screen flex items-center justify-center">
  <div class="w-80">

    <h1 class="text-xl font-bold mb-4">Logga in</h1>

    <input id="email" class="border p-2 w-full mb-2" placeholder="email">
    <input id="password" class="border p-2 w-full mb-2" type="password">

    <button onclick="login()" class="bg-black text-white w-full p-2">
      Logga in
    </button>

    <p class="text-sm text-gray-500 mt-3">
      Demo: test@test.com / 123456
    </p>

  </div>
</div>

<script>
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email, password })
  });

  if (!res.ok) {
    alert("Fel inloggning");
    return;
  }

  const data = await res.json();

  localStorage.setItem("token", data.token);

  // 👉 viktig förbättring
  window.location.href = "/dashboard.html";
}
</script>
